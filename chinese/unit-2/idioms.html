<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-title" content="成語挑戰">
<title>成語挑戰</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css?v=1.3.1">
<link rel="stylesheet" href="../../assets/zhuyin.css?v=1.3.1">
<style>
/* Layout: nav, banner, round tabs, the idiom bank (round 1) or letter tiles (round 2), question cards, a sticky submit bar */
:root{--good:#2f9e44;--good-soft:#dff3e3;--bad:#d6453a;--bad-soft:#fde4e1;--frost:#3f9cc8;--f-kai:"BiauKai","標楷體","DFKai-SB","Kaiti TC","STKaiti","PingFang TC","Microsoft JhengHei",serif}
.cover{background:#FFF1D6}
@media (max-width:640px){.cover{background:#C4453A}}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{min-height:58px;border-radius:16px;border:3px solid var(--line);background:#fff;font:700 19px var(--f-body);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab small{font-size:14px;color:var(--ink-soft);font-weight:600}
.tab.on{border-color:var(--leaf);background:var(--leaf);color:#fff}
.tab.on small{color:#e4f1da}
.howto{background:#fff8dc;border:2px dashed #e6c55a;border-radius:16px;padding:12px 16px;line-height:1.8;font-size:17px;margin:0}
.bank{position:sticky;top:0;z-index:5;background:var(--meadow);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:500 22px/1.5 var(--f-kai);background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 14px;color:var(--ink);min-height:52px}
.chip.sel{border-color:var(--frost);background:#e2f5fd;transform:translateY(-3px);box-shadow:0 4px 0 #9fd3ea}
.chip.used{opacity:.25;pointer-events:none}
.qlist{display:flex;flex-direction:column;gap:12px}
.qc{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.qc.right{border-color:var(--good);background:#f6fcf7}
.qc.wrong{border-color:var(--bad);background:#fff8f7}
.qh{display:flex;align-items:center;gap:10px}
.qn{font:700 15px var(--f-display);background:var(--leaf-soft);color:var(--leaf-deep);border-radius:999px;padding:3px 12px}
.spk{margin-left:auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;display:grid;place-items:center;padding:0}
.spk svg{width:22px;height:22px}
.sent{margin:0;font:500 21px/2.3 var(--f-kai)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:7.2em;min-height:1.9em;padding:0 .3em;margin:0 .15em;border:3px dashed #b8cfae;border-radius:12px;background:#f4f9ef;vertical-align:middle;font:inherit;color:var(--leaf-deep);cursor:pointer}
.slot.hot{border-color:var(--frost);background:#e9f6fc}
.slot.filled{border-style:solid;border-color:var(--leaf);background:#fff}
.qc.right .slot{border-color:var(--good);background:var(--good-soft)}
.qc.wrong .slot{border-color:var(--bad);background:var(--bad-soft)}
.boxes{display:flex;gap:6px}
.boxes .bx{width:52px;height:56px;border:3px dashed #b8cfae;border-radius:12px;background:#f4f9ef;display:grid;place-items:center;font:500 26px var(--f-kai);color:var(--leaf-deep);padding:0}
.boxes .bx.filled{border-style:solid;border-color:var(--leaf);background:#fff}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:52px;height:56px;border:3px solid var(--line);border-radius:12px;background:#fff;font:500 24px var(--f-kai);color:var(--ink);display:grid;place-items:center;padding:0}
.tile.used{opacity:.2;pointer-events:none}
.fb{border-radius:12px;padding:8px 12px;font-size:16px;line-height:1.7}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.bar{position:sticky;bottom:0;z-index:5;background:rgba(228,241,218,.96);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .prog{flex:1;font-weight:700;min-width:140px}
.bar .prog.warn{color:var(--bad)}
.btn{min-height:52px;border-radius:999px;padding:0 22px;font:700 18px var(--f-body);border:3px solid var(--leaf);background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leaf-deep)}
.btn.ghost{background:#fff;color:var(--leaf-deep);border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.result{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--sun-deep);border-radius:22px;padding:14px 16px;flex-wrap:wrap}
.result .sc{font:700 64px/1 var(--f-display);color:#c4453a;font-variant-numeric:tabular-nums}
.result .sc small{font-size:22px;color:var(--ink-soft)}
.result p{margin:0;font-size:18px;line-height:1.7}
.result .crew{display:flex;flex-wrap:wrap}
.result .crew svg{width:48px;height:70px}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--frost);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="導覽">
    <a href="../../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5.5h3v5.5h5V10" fill="currentColor"/></svg>回大廳</a>
    <a class="ghost" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>第二單元</a>
    <a class="ghost" href="lesson-4.html">第四課</a>
  </nav>

  <header class="cover hopper">
    <svg id="coverArt" viewBox="0 0 1000 220" role="img" aria-label="成語挑戰封面"></svg>
    <div class="cover-text"><div class="unit">第四課 補充</div><h1>成語挑戰</h1></div>
  </header>

  <div class="tabs" id="tabs"></div>
  <p class="howto zyarea" id="howto"></p>
  <div id="result"></div>
  <div class="bank zyarea" id="bank"></div>
  <div class="qlist zyarea" id="qlist"></div>
  <div class="bar" id="bar"></div>
</div>
<footer class="fan-note" style="text-align:center;font-size:13px;color:#56627c;padding:4px 16px 20px">非官方、粉絲自製教材・僅供學習使用</footer>

<script src="../../assets/pikmin.js?v=1.3.1"></script>
<script src="../../assets/zhuyin.js?v=1.3.1"></script>
<script src="../../assets/zhuyin-data.js?v=1.3.1"></script>
<script>
const $=s=>document.querySelector(s);
const {pikG,pikAt,shuffle,KEYS}=Pik;
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.6 8.6 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

/* ---------- voice ---------- */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[「」（）()_]/g,' '));u.lang='zh-TW';if(voice)u.voice=voice;u.rate=.92;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
let actx=null;
function tone(fs,d=.1,type='triangle',vol=.14){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0+i*d);g.gain.linearRampToValueAtTime(vol,t0+i*d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+i*d+d*1.6);o.connect(g).connect(actx.destination);o.start(t0+i*d);o.stop(t0+i*d+d*1.8)})}catch(e){}}
const sfx={pop:()=>tone([620],.06,'triangle',.08),good:()=>tone([660,880,1175]),bad:()=>tone([240,190],.15,'square',.05),win:()=>tone([523,659,784,1046,1318])};

/* ---------- data (from the worksheet; answers checked against the answer key) ---------- */
const MEAN={
  '聽天由命':'事情已經沒有辦法改變，只能接受結果。',
  '良藥苦口':'真心的勸告雖然不好聽，卻對人有幫助。',
  '相依為命':'互相依靠著生活，誰也離不開誰。',
  '對症下藥':'找出真正的原因，再用對的方法來解決。',
  '借花獻佛':'拿別人送的東西，再轉送給其他人。',
  '耳提面命':'當面一再的提醒、教導。',
  '長治久安':'國家長久的安定、太平。',
  '天翻地覆':'變化非常非常大。',
  '打退堂鼓':'事情做到一半，想要放棄、退縮。'
};
const BANK=['聽天由命','良藥苦口','相依為命','對症下藥','借花獻佛','耳提面命','長治久安','天翻地覆','打退堂鼓'];
const R1=[
  ['這盒餅乾是阿姨送給我的，我拿出來請同學吃，真是（_）。','借花獻佛'],
  ['爬山才爬到一半，小明就因為山路太陡而想要（_），不願意繼續往上走。','打退堂鼓'],
  ['醫生仔細檢查病人的身體，找出真正的病因，才能（_），幫助病人康復。','對症下藥'],
  ['大家都希望國家能夠（_），讓人民過著和平、安定的生活。','長治久安'],
  ['老師的批評雖然不太好聽，卻能幫助我們改正缺點，真是（_）。','良藥苦口'],
  ['媽媽經常（_），提醒我要誠實做人，不可以隨便說謊。','耳提面命'],
  ['幾年沒回家鄉，沒想到原本的小村莊變成了熱鬧的城市，真是有了（_）的變化。','天翻地覆'],
  ['老爺爺和陪伴他多年的狗兒互相照顧、彼此依靠，過著（_）的生活。','相依為命'],
  ['考試已經結束，答案也不能修改了，小華只好（_），等待成績公布。','聽天由命']
];
const R2=[
  ['爺爺和奶奶一起生活了五十多年，無論遇到什麼困難，都互相扶持，兩人早已（_）。','相依為命'],
  ['戰爭終於結束了，人民都希望國家從此（_），不再受到戰亂的威脅。','長治久安'],
  ['抽獎券已經交出去，現在不管多麼緊張都無法改變結果，只能（_），等待開獎。','聽天由命'],
  ['這些水果是鄰居送給我的，我分了一些給好朋友，算是（_）。','借花獻佛'],
  ['爸爸對弟弟（_），不斷提醒他騎腳踏車時一定要遵守交通規則。','耳提面命'],
  ['十年後再次回到母校，發現教室、操場和校園環境都與以前完全不同，真有（_）的感覺。','天翻地覆'],
  ['妹妹原本很有信心參加演講比賽，但是看到台下坐滿觀眾，突然想（_），不敢上臺。','打退堂鼓'],
  ['爸爸告訴我，朋友指出我的錯誤雖然讓我難過，但忠告往往（_），應該虛心接受。','良藥苦口'],
  ['老師發現小華的數學成績不好，是因為乘法還不熟練，因此特別安排乘法練習，這種（_）的教學方式，讓小華進步很多。','對症下藥']
];
/* round 2: each question gets its four characters plus four from other idioms, mixed */
function tilesFor(ans,i){
  const others=shuffle([...BANK.filter(w=>w!==ans).join('')]).filter(c=>!ans.includes(c));
  return shuffle([...ans,...[...new Set(others)].slice(0,4)]);
}

/* ---------- state ---------- */
let round=1;
const S={1:null,2:null};
function fresh(r){
  return r===1?{ans:R1.map(()=>null),sel:null,sub:false}
              :{ans:R2.map(()=>[]),tiles:R2.map(([,a],i)=>tilesFor(a,i)),sub:false};
}
S[1]=fresh(1);S[2]=fresh(2);
const best={1:null,2:null};
const list=()=>round===1?R1:R2;
const isRight=i=>round===1?S[1].ans[i]===R1[i][1]:S[2].ans[i].map(k=>S[2].tiles[i][k]).join('')===R2[i][1];
const isDone=i=>round===1?!!S[1].ans[i]:S[2].ans[i].length===4;
const score=()=>list().filter((_,i)=>isRight(i)).length*5;

/* ---------- render ---------- */
function renderTabs(){
  $('#tabs').innerHTML=[1,2].map(r=>`<button class="tab ${r===round?'on':''}" data-r="${r}">${r===1?'第一回 成語選一選':'第二回 成語想一想'}<small>${best[r]==null?'9 題・每題 5 分':`最近一次：${best[r]} / 45 分`}</small></button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{round=+b.dataset.r;sfx.pop();render();window.scrollTo(0,0);});
}
function render(){
  renderTabs();
  const st=S[round];
  $('#howto').textContent=round===1
    ?'從上面的成語選項中，選出最適合的成語，放進句子的空格。先點一個成語，再點空格；點已經放好的空格，可以把成語拿回來。每個成語只能用一次。'
    :'這一回沒有成語選項！讀一讀句子，想出最適合的成語，再用下面的字卡把它拼出來。點錯了，點上面的格子就能拿回來。';
  /* bank */
  if(round===1&&!st.sub){
    const used=new Set(st.ans.filter(Boolean));
    $('#bank').innerHTML=BANK.map(w=>`<button class="chip ${used.has(w)?'used':''} ${st.sel===w?'sel':''}" data-w="${w}">${w}</button>`).join('');
    $('#bank').hidden=false;
    $('#bank').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sfx.pop();st.sel=st.sel===b.dataset.w?null:b.dataset.w;say(b.dataset.w);render();});
  }else{$('#bank').innerHTML='';$('#bank').hidden=true;}
  /* questions */
  $('#qlist').innerHTML=list().map(([s,a],i)=>{
    const cls=st.sub?(isRight(i)?'right':'wrong'):'';
    let body;
    if(round===1){
      const v=st.ans[i];
      body=`<p class="sent">${s.split('（_）').map(ZY.html).join(`<button class="slot ${v?'filled':''} ${!v&&st.sel?'hot':''}" data-i="${i}" ${st.sub?'disabled':''}>${v?ZY.html(v):'　'}</button>`)}</p>`;
    }else{
      const pick=st.ans[i],t=st.tiles[i];
      body=`<p class="sent">${s.split('（_）').map(ZY.html).join('（　　　　）')}</p>
        <div class="boxes">${[0,1,2,3].map(k=>`<button class="bx ${pick[k]!=null?'filled':''}" data-i="${i}" data-k="${k}" ${st.sub?'disabled':''}>${pick[k]!=null?ZY.html(t[pick[k]]):''}</button>`).join('')}</div>
        ${st.sub?'':`<div class="tiles">${t.map((c,k)=>`<button class="tile ${pick.includes(k)?'used':''}" data-i="${i}" data-t="${k}">${ZY.html(c)}</button>`).join('')}</div>`}`;
    }
    const fb=st.sub?`<div class="fb ${isRight(i)?'ok':'no'}"><b>${isRight(i)?'答對了！':'正確答案：'+a}</b>　${a}：${MEAN[a]}</div>`:'';
    return `<article class="qc ${cls}" id="q${i}"><div class="qh"><span class="qn">第 ${i+1} 題</span><button class="spk" data-say="${i}" aria-label="聽題目">${SPK}</button></div>${body}${fb}</article>`;
  }).join('');
  /* bar */
  const n=list().filter((_,i)=>isDone(i)).length;
  $('#bar').innerHTML=st.sub
    ?`<span class="prog">第${round===1?'一':'二'}回：${score()} / 45 分</span><button class="btn ghost" id="other">${round===1?'去第二回':'去第一回'}</button><button class="btn" id="again">再挑戰一次</button>`
    :`<span class="prog" id="prog">已作答 ${n} / 9</span><button class="btn" id="submit">交卷</button>`;
  bind();
  renderResult();
}
function bind(){
  const st=S[round];
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>{const [s]=list()[+b.dataset.say];say(s.replace('（_）','，空格，'))});
  if(round===1){
    document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;
      if(st.ans[i]){st.ans[i]=null;sfx.pop();render();return;}
      if(!st.sel){const c=$('#bank');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');say('先點上面的一個成語，再點空格。');return;}
      st.ans[i]=st.sel;st.sel=null;sfx.good();render();
    });
  }else{
    document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=+b.dataset.t,p=st.ans[i];if(p.length<4&&!p.includes(k)){p.push(k);sfx.pop();say(st.tiles[i][k]);render();}});
    document.querySelectorAll('.bx').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=+b.dataset.k,p=st.ans[i];if(k<p.length){p.splice(k,1);sfx.pop();render();}});
  }
  const sub=$('#submit');
  if(sub)sub.onclick=()=>{
    const k=list().findIndex((_,i)=>!isDone(i));
    if(k>=0){const p=$('#prog');p.textContent=`第 ${k+1} 題還沒有作答完喔！`;p.classList.add('warn');$('#q'+k).scrollIntoView({behavior:'smooth',block:'center'});say(`第 ${k+1} 題還沒有作答完喔！`);sfx.bad();return;}
    st.sub=true;best[round]=score();
    score()>=30?sfx.win():sfx.good();
    render();window.scrollTo({top:0,behavior:'smooth'});
  };
  const ag=$('#again');if(ag)ag.onclick=()=>{S[round]=fresh(round);render();window.scrollTo(0,0);};
  const ot=$('#other');if(ot)ot.onclick=()=>{round=round===1?2:1;render();window.scrollTo(0,0);};
}
function renderResult(){
  const st=S[round];
  if(!st.sub){$('#result').innerHTML='';return;}
  const s=score(),n=s/5;
  const msg=s===45?'全部答對！你是成語大師！':s>=36?'好厲害！看看答錯的題目，下次就全對了！':s>=27?'不錯喔！看看解說，再挑戰一次！':'沒關係！看看每個成語的意思，我們再試一次！';
  const total=best[1]!=null&&best[2]!=null?`<p>兩回合計：<b>${best[1]+best[2]}</b> / 90 分</p>`:'';
  $('#result').innerHTML=`<section class="result"><div class="sc">${s}<small> / 45</small></div><div class="zyarea" style="flex:1;min-width:200px"><p><b>${msg}</b></p><p>答對 ${n} 題，答錯 ${9-n} 題。</p>${total}</div><div class="crew">${KEYS.map(k=>`<svg viewBox="-5 -24 110 178" aria-hidden="true"><g class="pik wave">${pikG(k)}</g></svg>`).join('')}</div></section>`;
  say(`第${round===1?'一':'二'}回，你得到 ${s} 分！${msg}`);
}

/* ---------- cover ---------- */
document.getElementById('coverArt').innerHTML=`<rect width="1000" height="220" fill="#FFF1D6"/>
  ${['聽天由命','良藥苦口','天翻地覆','打退堂鼓'].map((w,i)=>`<g transform="translate(${[30,40,820,810][i]},${[30,96,30,96][i]}) rotate(${i%2?4:-4})"><rect width="150" height="46" rx="10" fill="#FFFFFF" stroke="#E2A8A0" stroke-width="3"/><text x="75" y="32" text-anchor="middle" font-size="24" fill="#A8281F" font-family="BiauKai,DFKai-SB,serif">${w}</text></g>`).join('')}
  <path d="M0,170 C250,150 500,166 750,160 C850,158 930,152 1000,160 L1000,220 L0,220Z" fill="#E9C98A"/>
  ${shuffle(KEYS).slice(0,4).map((k,i)=>pikAt(k,120+i*250,214,.4,i%2?'':'wave')).join('')}`;

ZY.watch('.zyarea');
render();
</script>
<script src="../../assets/catalog.js?v=1.3.1"></script>
<script src="../../assets/report.js?v=1.3.1"></script>
</body>
