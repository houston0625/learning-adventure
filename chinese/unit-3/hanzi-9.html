<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-title" content="第九課 生字卡">
<title>第九課 生字卡</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../../assets/chinese.css?v=1.20.0">

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="unit">國語四上・第九課 請到我的家鄉來</span>
      <h1>第九課 生字卡</h1>
    </div>
    <ol class="steps" id="steps"></ol>
    <a id="homeBtn" class="home-btn" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5.5h3v5.5h5V10" fill="currentColor"/></svg><span>回單元</span></a>
    <button id="soundBtn" class="sound" aria-pressed="true"></button>
  </header>

  <main id="playView" class="play">
    <div class="stage-wrap"><svg id="stage" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet" role="img" aria-label="第九課 生字卡"></svg></div>
    <aside class="side">
      <section class="dialog" id="dialog" aria-live="polite">
        <div class="portrait" id="portrait"></div>
        <div class="bubble">
          <span class="who" id="who"></span>
          <p id="line"></p>
          <div class="dlg-actions">
            <button id="replayBtn" class="icon-btn" aria-label="再聽一次"></button>
            <button id="moreBtn" class="more" hidden></button>
          </div>
        </div>
      </section>
      <div class="task" id="task"></div>
      <div class="controls" id="controls"></div>
      <nav class="nav">
        <button id="prevBtn">上一步</button>
        <button id="nextBtn" class="primary">下一步</button>
      </nav>
    </aside>
  </main>

  <main id="quizView" class="quiz" hidden></main>
</div>

<div id="notes" class="notes" hidden role="dialog" aria-modal="true" aria-label="重點整理">
  <div class="notes-card">
    <h2>重點整理</h2>
    <div class="notes-grid"></div>
    <div class="notes-actions">
      <button class="ghost-btn" id="readNotes"></button>
      <button class="primary-btn" id="closeNotes">看完了</button>
    </div>
  </div>
</div>
<footer class="fan-note">非官方、粉絲自製教材・僅供學習使用</footer>
<script src="../../assets/pikmin.js?v=1.20.0"></script>
<script src="../../assets/zhuyin.js?v=1.20.0"></script>
<script src="../../assets/zhuyin-data.js?v=1.20.0"></script>
<script src="../../assets/core.js?v=1.20.0"></script>
<script src="../../assets/chinese.js?v=1.20.0"></script>
<script>
/* 第九課 生字卡：課本 p98「我會寫字」15 個生字（注音、部首、部首注音、部首外筆畫／總筆畫都照課本）。
   點生字看注音、部首、筆畫、造詞，再用手指在格子裡寫寫看（chinese.js 的 CN.hanzi）。 */
const {plainArt}=CN;
const HANZI=[
  {c:'佛',zy:'ㄈㄛˊ',bu:'人',buzy:'ㄖㄣˊ',n:5,total:7,words:['千佛之國','佛教']},
  {c:'逛',zy:'ㄍㄨㄤˋ',bu:'辵',buzy:'ㄔㄨㄛˋ',n:7,total:11,words:['逛逛']},
  {c:'堤',zy:'ㄊㄧˊ',bu:'土',buzy:'ㄊㄨˇ',n:9,total:12,words:['築堤','河堤']},
  {c:'泰',zy:'ㄊㄞˋ',bu:'水',buzy:'ㄕㄨㄟˇ',n:5,total:10,words:['泰國']},
  {c:'埃',zy:'ㄞ',bu:'土',buzy:'ㄊㄨˇ',n:7,total:10,words:['埃及','塵埃']},
  {c:'防',zy:'ㄈㄤˊ',bu:'阜',buzy:'ㄈㄨˋ',n:4,total:7,words:['防潮','預防']},
  {c:'廟',zy:'ㄇㄧㄠˋ',bu:'广',buzy:'ㄧㄢˇ',n:12,total:15,words:['寺廟']},
  {c:'羅',zy:'ㄌㄨㄛˊ',bu:'网',buzy:'ㄨㄤˇ',n:14,total:19,words:['開羅','尼羅河']},
  {c:'潮',zy:'ㄔㄠˊ',bu:'水',buzy:'ㄕㄨㄟˇ',n:12,total:15,words:['防潮','潮水']},
  {c:'鬱',zy:'ㄩˋ',bu:'鬯',buzy:'ㄔㄤˋ',n:19,total:29,words:['鬱金香']},
  {c:'勢',zy:'ㄕˋ',bu:'力',buzy:'ㄌㄧˋ',n:11,total:13,words:['地勢','姿勢']},
  {c:'華',zy:'ㄏㄨㄚˊ',bu:'艸',buzy:'ㄘㄠˇ',n:8,total:12,words:['華麗']},
  {c:'划',zy:'ㄏㄨㄚˊ',bu:'刀',buzy:'ㄉㄠ',n:4,total:6,words:['划船']},
  {c:'窪',zy:'ㄨㄚ',bu:'穴',buzy:'ㄒㄩㄝˊ',n:9,total:14,words:['低窪']},
  {c:'尚',zy:'ㄕㄤˋ',bu:'小',buzy:'ㄒㄧㄠˇ',n:5,total:8,words:['和尚','時尚']}
];
SCENES=[{label:'生字卡',build:()=>{
  CN.hanzi({chars:HANZI,art:plainArt,doneText:'十五個生字都認識了！可以再點生字多寫幾次。'});
  if(done[cur])setDialog('purple','想再練習，就點一個生字，在格子裡寫寫看。');
  else talk([{who:'purple',t:'第九課的十五個生字來囉！點一個生字，看看注音、部首和筆畫，再用手指寫寫看。'}]);
}}];
done=[false];
goTo(0);
</script>
<script src="../../assets/catalog.js?v=1.20.0"></script>
<script src="../../assets/report.js?v=1.20.0"></script>
</body>
</html>
