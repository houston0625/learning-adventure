<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-title" content="字音字形">
<title>國語・字音字形</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../../assets/site.css?v=1.10.0">
<style>
/* Layout: nav pills, banner, four test cards (each one answer sheet, two pages of 50), notes for parents */
.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.cover{background:#FDE4E1}
.yin .tag{background:#e2f5fd;color:#2c6f93}
.xing .tag{background:#fde4e1;color:#a8281f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.two .go{margin-top:0;text-decoration:none;font-size:18px}
.two .go small{font-size:14px;font-weight:600;opacity:.9}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="導覽">
    <a href="../../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5.5h3v5.5h5V10" fill="currentColor"/></svg>回大廳</a>
    <a class="ghost" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>國語</a>
    <span class="crumb">皮皮學習樂園 › 國語 › 字音字形</span>
  </nav>

  <header class="cover hopper">
    <svg id="coverArt" viewBox="0 0 1000 300" role="img" aria-label="字音字形封面：注音卡和國字卡"></svg>
    <div class="cover-text"><div class="unit">國語四上</div><h1>字音字形</h1></div>
  </header>

  <section class="intro hopper" id="intro"></section>

  <main class="cards" id="cards"></main>

  <section class="tips">
    <h3>給爸爸媽媽</h3>
    <ol>
      <li>題目來自新北市國小組字音字形試題（一）和另一份字音、字形試題，共 400 題，照試卷的順序，分成 8 頁，每頁 50 題、每題 2 分。</li>
      <li>字音：選出顏色不一樣的字正確的注音；字形：選出括號裡正確的國字。每題 4 個選項，答案以試卷上的答案為準。</li>
      <li>這個單元不朗讀、也不加注音，念出來或標出注音就等於告訴孩子答案了。</li>
    </ol>
  </section>
</div>
<footer class="fan-note" style="text-align:center;font-size:13px;color:#56627c;padding:4px 16px 20px">非官方、粉絲自製教材・僅供學習使用</footer>

<script src="../../assets/pikmin.js?v=1.10.0"></script>
<script>
const {pikG,pikAt,shuffle,KEYS,next,name}=Pik;
const SHEETS=[['字音（一）','yin','分際、拘泥、豁達大度…'],['字形（一）','xing','明察秋毫、斷垣殘壁…'],['字音（二）','yin','荏苒、星宿、不著痕跡…'],['字形（二）','xing','奠基、坎坷、罄竹難書…']];
const ARROW='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>';
document.getElementById('cards').innerHTML=SHEETS.map(([nm,k,eg],i)=>`<section class="card ${k}">
  <svg class="art" viewBox="0 0 320 180" aria-hidden="true">${art(k,i)}</svg>
  <div class="body"><span class="tag">${k==='yin'?'字音':'字形'}</span><h2>${nm}</h2>
    <ul><li>${k==='yin'?'看國字，選出正確的注音':'看詞語，選出正確的國字'}</li><li>例如：${eg}</li></ul>
    <div class="meta"><span>100 題</span><span>分 2 頁</span></div>
    <div class="two"><a class="go" href="test-${i*2+1}.html">第 ${i*2+1} 頁<small>1～50</small></a><a class="go" href="test-${i*2+2}.html">第 ${i*2+2} 頁<small>51～100</small></a></div>
  </div></section>`).join('');
function art(k,i){
  const bg=k==='yin'?'#E2F5FD':'#FDE4E1', ink=k==='yin'?'#2C6F93':'#A8281F';
  const cards=k==='yin'?['ㄅ','ㄆ','ㄇ']:['字','音','形'];
  return `<rect width="320" height="180" fill="${bg}"/>${cards.map((c,j)=>`<g transform="translate(${40+j*90},${36+(j%2)*24}) rotate(${j%2?4:-4})"><rect width="64" height="64" rx="10" fill="#FFF" stroke="${ink}" stroke-width="3"/><text x="32" y="45" text-anchor="middle" font-size="36" font-weight="700" fill="${ink}">${c}</text></g>`).join('')}${pikAt(KEYS[(i*2)%KEYS.length],270,176,.3)}`;
}
document.getElementById('coverArt').innerHTML=`<rect width="1000" height="300" fill="#FDE4E1"/>
  ${['ㄓ','字','ㄒ','形'].map((c,j)=>`<g transform="translate(${[60,170,770,880][j]},${[50,120,50,120][j]}) rotate(${j%2?5:-5})"><rect width="80" height="80" rx="12" fill="#FFF" stroke="#E2A8A0" stroke-width="4"/><text x="40" y="56" text-anchor="middle" font-size="44" font-weight="700" fill="#A8281F">${c}</text></g>`).join('')}
  <path d="M0,240 C250,220 500,236 750,230 C850,228 930,222 1000,230 L1000,300 L0,300Z" fill="#E9C98A"/>
  ${shuffle([...KEYS]).slice(0,5).map((k,i)=>pikAt(k,200+i*150,290,.5,i%2?'':'wave')).join('')}`;
const host=next();
document.getElementById('intro').innerHTML=`<svg viewBox="-5 -24 110 178" aria-hidden="true"><g class="pik wave">${pikG(host)}</g></svg><p>我是<b>${name(host)}</b>！字音字形一共 400 題，分成 8 頁，每頁 50 題。一次做一頁就好，加油！</p>`;
</script>
<script src="../../assets/catalog.js?v=1.10.0"></script>
<script src="../../assets/report.js?v=1.10.0"></script>
</body>
</html>
