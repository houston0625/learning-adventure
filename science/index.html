<script src="../assets/pikmin.js?v=1.6.1"></script>
<script>
const {pikG,pikAt,next,sun,cloud,flower,stars,moonG,name}=Pik;

document.getElementById('coverArt').innerHTML=`<rect width="1000" height="260" fill="url(#daySky)"/>
  ${sun(120,70,26)}${cloud(330,60,.9)}${cloud(760,48,.8)}
  <path d="M0,190 C200,160 380,182 520,180 C680,178 840,156 1000,184 L1000,260 L0,260Z" fill="#5FAE49"/>
  <path d="M0,222 C200,204 400,216 520,214 C700,212 840,202 1000,212 L1000,260 L0,260Z" fill="#79C05A"/>
  ${flower(70,240,'#FFFFFF')}${flower(930,236,'#FF9EC4')}
  ${pikAt(next(),250,246,.5,'wave')}${pikAt(next(),760,246,.5)}${pikAt(next(),840,250,.46,'wave')}`;

const host=next();
document.getElementById('intro').innerHTML=`<svg viewBox="-5 -24 110 178" aria-hidden="true"><g class="pik wave">${pikG(host)}</g></svg><p>我是<b>${name(host)}</b>！這裡是自然教室，我們一起去觀察、動手做實驗吧！先從第 1 單元開始！</p>`;

document.getElementById('art1').innerHTML=`<rect width="320" height="180" fill="url(#coverSky)"/>${stars(3,30,170,320,130)}
  ${sun(60,52,16)}<g transform="translate(268,48)">${moonG(.3,15)}</g>
  <path d="M0,150 C80,138 220,146 320,136 L320,180 L0,180Z" fill="#5FAE49"/>
  ${pikAt(next(),120,174,.34)}${pikAt(next(),172,174,.34)}${pikAt(next(),224,174,.34)}`;

document.getElementById('art2').innerHTML=`<rect width="320" height="180" fill="#E2F5FD"/>
  ${cloud(80,50,.8)}${cloud(240,40,.6)}
  <rect y="146" width="320" height="34" fill="#79C05A"/>
  <g transform="translate(160,92)"><circle r="34" fill="#FFFFFF" stroke="#C9CFDA" stroke-width="3"/><text y="16" text-anchor="middle" font-size="46" font-weight="700" fill="#9AA0B3" font-family="Fredoka,sans-serif">?</text></g>
  ${pikAt(next(),70,174,.34)}${pikAt(next(),250,174,.34)}`;
</script>
