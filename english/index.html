<script src="../assets/pikmin.js?v=1.8.0"></script>
<script>
const {pikG,pikAt,next,sun,cloud,name}=Pik;
const block=(t,c,x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><rect width="56" height="56" rx="8" fill="${c}" stroke="#1E2A45" stroke-width="2.5"/><rect x="7" y="7" width="42" height="42" rx="5" fill="#FFFFFF" opacity=".9"/><text x="28" y="44" text-anchor="middle" font-size="36" font-weight="700" fill="${c}" font-family="Fredoka,sans-serif">${t}</text></g>`;

document.getElementById('coverArt').innerHTML=`<rect width="1000" height="260" fill="url(#daySky)"/>
  ${sun(110,66,24)}${cloud(380,56,.8)}${cloud(780,44,.7)}
  <path d="M0,210 C200,200 380,206 520,204 C700,202 840,196 1000,206 L1000,260 L0,260Z" fill="#79C05A"/>
  ${block('A','#EF4B3F',560,150)}${block('B','#3F86E6',620,150)}${block('C','#FFC93C',590,94)}
  ${pikAt(next(),250,246,.5,'wave')}${pikAt(next(),330,250,.46)}${pikAt(next(),880,246,.5,'wave')}`;

const host=next();
document.getElementById('intro').innerHTML=`<svg viewBox="-5 -24 110 178" aria-hidden="true"><g class="pik wave">${pikG(host)}</g></svg><p>我是<b>${name(host)}</b>！Hello！這裡是英文教室。先聽、再說，用玩的把英文學起來！</p>`;

document.getElementById('art1').innerHTML=`<rect width="320" height="180" fill="url(#daySky)"/>
  ${cloud(90,50,.6)}${sun(250,46,16)}
  <path d="M0,146 C100,140 220,148 320,142 L320,180 L0,180Z" fill="#79C05A"/>
  ${block('W','#3F86E6',150,86,.9)}${block('3','#FFC93C',204,86,.9)}
  ${pikAt(next(),70,172,.34,'wave')}`;
</script>
